<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denvasweb — Portafolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #241E15;
    --section-tint: #F2E4C0;
    --gold-pale: #EBE3B5;
    --gold: #A9822F;
    --gold-light: #C7A050;
    --gold-deep: #B69567;
    --off-white: #F9F4E7;
    --white: #FFFFFF;
    --text: #5B5347;
    --text-light: #9C9385;
    --border: #E4D8B8;
    --device-bezel: #2B2620;
    --radius: 14px;
    --radius-sm: 8px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--off-white);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  /* ---- Header ---- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(249, 244, 231, 0.85);
    backdrop-filter: blur(10px);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-deep));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand .sub{
    font-size:0.8rem;
    font-weight:500;
    color: var(--text-light);
  }
  .reel-info{
    text-align:right;
  }
  .reel-info .name{
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:-0.01em;
    color: var(--ink);
  }
  .reel-info .count{
    font-size:0.75rem;
    font-weight:500;
    color: var(--text-light);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Sprocket dots (signature element) ---- */
  .sprockets{
    display:flex;
    gap:6px;
    justify-content:center;
    padding: 12px 0 8px;
    background: var(--off-white);
    flex-shrink:0;
  }
  .sprockets button{
    width:8px; height:8px;
    border-radius:50%;
    border:1px solid var(--border);
    background: var(--white);
    padding:0;
    cursor:pointer;
    transition: all .3s var(--ease);
  }
  .sprockets button.active{
    background: linear-gradient(135deg, var(--gold-light), var(--gold-deep));
    border-color: transparent;
    width:22px;
    border-radius:5px;
  }

  /* ---- Viewer ---- */
  .viewer-wrap{
    flex:1;
    position:relative;
    padding: 0 28px 22px;
    min-height:0;
  }
  .viewer{
    position:relative;
    height:100%;
    border-radius: var(--radius);
    overflow:hidden;
    background: var(--device-bezel);
    padding: 14px 14px 0;
    display:flex;
    flex-direction:column;
    box-shadow: 0 8px 30px rgba(36,30,21,0.12);
  }
  .device-dots{
    display:flex;
    gap:6px;
    padding-bottom:12px;
    flex-shrink:0;
  }
  .device-dots span{
    width:9px; height:9px;
    border-radius:50%;
    background: rgba(249,244,231,0.18);
  }
  .screen{
    position:relative;
    flex:1;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    overflow:hidden;
    background: var(--white);
    min-height:0;
  }
  iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#fff;
  }
  .nav-edge{
    position:absolute;
    top:0; bottom:0;
    width:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: transparent;
    border:0;
    cursor:pointer;
    color: var(--gold-deep);
    opacity:0;
    transition: opacity .2s var(--ease), background .2s var(--ease);
    z-index:2;
  }
  .screen:hover .nav-edge{ opacity:1; }
  .nav-edge:hover{ background: linear-gradient(90deg, rgba(36,30,21,0.06), transparent); }
  .nav-edge.right:hover{ background: linear-gradient(270deg, rgba(36,30,21,0.06), transparent); }
  .nav-edge.left{ left:0; }
  .nav-edge.right{ right:0; }
  .nav-edge svg{ width:26px; height:26px; }

  .loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-light);
    font-size:0.85rem;
    font-weight:500;
    background: var(--off-white);
    z-index:1;
  }
  .loading.hidden{ display:none; }

  /* ---- Bottom controls ---- */
  footer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding: 18px 28px 24px;
    border-top: 1px solid var(--border);
    background: var(--off-white);
    flex-shrink:0;
  }
  .btn{
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:0.85rem;
    font-weight:700;
    letter-spacing:-0.01em;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    transition: transform .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .btn:hover{
    border-color: var(--gold-light);
    color: var(--gold-deep);
    transform: translateY(-2px);
  }
  .btn:active{ transform: translateY(0); }
  .btn.primary{
    background: linear-gradient(135deg, var(--gold-light), var(--gold-deep));
    border-color: transparent;
    color: var(--white);
    box-shadow: 0 6px 18px rgba(169,130,47,0.28);
  }
  .btn.primary:hover{
    color: var(--white);
    box-shadow: 0 10px 24px rgba(169,130,47,0.36);
  }
  .btn svg{ width:16px; height:16px; }

  @media (max-width: 640px){
    header{ padding: 14px 16px; }
    .brand .sub{ display:none; }
    .viewer-wrap{ padding: 0 14px 16px; }
    footer{ flex-wrap:wrap; padding: 16px 14px 20px; gap:10px; }
    .btn{ padding: 11px 18px; font-size:0.8rem; }
    .nav-edge{ opacity:1; width:44px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">DENVASWEB</span>
    <span class="sub">portafolio</span>
  </div>
  <div class="reel-info">
    <div class="name" id="projectName">—</div>
    <div class="count" id="projectCount">— / —</div>
  </div>
</header>

<div class="sprockets" id="sprockets"></div>

<div class="viewer-wrap">
  <div class="viewer">
    <div class="device-dots"><span></span><span></span><span></span></div>
    <div class="screen">
      <div class="loading" id="loading">Cargando sitio…</div>
      <button class="nav-edge left" id="edgePrev" aria-label="Proyecto anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <iframe id="frame" title="Vista previa del proyecto"></iframe>
      <button class="nav-edge right" id="edgeNext" aria-label="Proyecto siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>
</div>

<footer>
  <a class="btn" href="https://denvasweb.com" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Volver a Denvasweb
  </a>
  <button class="btn" id="prevBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    Anterior
  </button>
  <button class="btn primary" id="nextBtn">
    Siguiente
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</footer>

<script>
  // ============================================
  // LISTA DE PROYECTOS
  // Para agregar uno nuevo: copia una línea y
  // cambia el nombre y el link. Guarda, sube a
  // GitHub Desktop y listo — Netlify lo despliega.
  // ============================================
  const PROJECTS = [
    { name: "Sazón Urbana",         url: "https://sazon-urbana.netlify.app/",           slug: "sazon-urbana" },
    { name: "Aldrich & Co.",        url: "https://project-aldrich.netlify.app/",        slug: "aldrich" },
    { name: "SteelCrest Roofing",   url: "https://steelcrest-roofing.netlify.app/",     slug: "steelcrest" },
    { name: "Ironwood",             url: "https://project-ironwood.netlify.app/",       slug: "ironwood" },
    { name: "Pristine Pro",         url: "https://pristine-pro.netlify.app/",           slug: "pristine" },
  ];

  let current = 0;
  const frame = document.getElementById('frame');
  const loading = document.getElementById('loading');
  const projectName = document.getElementById('projectName');
  const projectCount = document.getElementById('projectCount');
  const sprockets = document.getElementById('sprockets');

  function buildSprockets(){
    sprockets.innerHTML = '';
    PROJECTS.forEach((p, i) => {
      const b = document.createElement('button');
      b.setAttribute('aria-label', 'Ir a ' + p.name);
      b.addEventListener('click', () => goTo(i));
      sprockets.appendChild(b);
    });
  }

  function render(){
    const p = PROJECTS[current];
    loading.classList.remove('hidden');
    frame.src = p.url;
    projectName.textContent = p.name;
    projectCount.textContent = (current + 1) + ' / ' + PROJECTS.length;
    [...sprockets.children].forEach((el, i) => {
      el.classList.toggle('active', i === current);
    });
    history.replaceState(null, '', '#' + p.slug);
  }

  frame.addEventListener('load', () => loading.classList.add('hidden'));

  function goTo(i){
    current = (i + PROJECTS.length) % PROJECTS.length;
    render();
  }
  function next(){ goTo(current + 1); }
  function prev(){ goTo(current - 1); }

  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('edgeNext').addEventListener('click', next);
  document.getElementById('edgePrev').addEventListener('click', prev);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });

  // Deep link support: open directly on a project via #slug
  // e.g. portfolio-denvasweb.netlify.app/#ironwood
  function getStartIndex(){
    const slug = location.hash.replace('#', '').toLowerCase().trim();
    if (!slug) return 0;
    const i = PROJECTS.findIndex(p => p.slug === slug);
    return i === -1 ? 0 : i;
  }

  buildSprockets();
  current = getStartIndex();
  render();
</script>

</body>
</html>
